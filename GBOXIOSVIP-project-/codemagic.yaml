workflows:
  ios-unsigned:
    name: GBOXIOSVIP iOS 2.1 build 2 (unsigned)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Check Xcode project
        script: |
          set -euo pipefail
          xcodebuild -list -project "$CM_BUILD_DIR/ThreeOneOSFive.xcodeproj"
      - name: Build unsigned GBOXIOSVIP app
        script: |
          set -o pipefail
          mkdir -p "$CM_BUILD_DIR/build/DerivedData/Build/Products/Release-iphoneos"
          xcodebuild \
            -project "$CM_BUILD_DIR/ThreeOneOSFive.xcodeproj" \
            -target "3105" \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$CM_BUILD_DIR/build/DerivedData/Build/Products/Release-iphoneos" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$CM_BUILD_DIR/build/xcodebuild.log"
      - name: Package compiled app as IPA
        script: |
          set -euo pipefail
          APP_PATH="$(find "$CM_BUILD_DIR/build" -type d -path '*/Release-iphoneos/*.app' -print -quit)"
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "Erro: o xcodebuild não produziu um arquivo .app"
            find "$CM_BUILD_DIR/build" -maxdepth 6 -type d -print || true
            exit 1
          fi
          echo "Aplicativo encontrado em: $APP_PATH"
          IPA_DIR="$CM_BUILD_DIR/build/ipa"
          mkdir -p "$IPA_DIR/Payload"
          ditto "$APP_PATH" "$IPA_DIR/Payload/3105.app"
          (cd "$IPA_DIR" && /usr/bin/zip -qry "$IPA_DIR/GBOXIOSVIP.ipa" Payload)
    artifacts:
      - build/ipa/GBOXIOSVIP.ipa
      - build/xcodebuild.log
